name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q common services tests
      - run: python -m unittest discover -s tests -v
      - run: docker compose config
      - run: docker build -f services/getmyinvoices/Dockerfile -t getmyinvoices-mcp:test .
      - run: docker build -f services/lexware/Dockerfile -t lexware-office-mcp:test .

