name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q common services tests
      - run: python -m unittest discover -s tests -v
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker build -f services/getmyinvoices/Dockerfile -t getmyinvoices-mcp:test .
      - run: docker build -f services/lexware/Dockerfile -t lexware-office-mcp:test .
      - name: Start both services and check liveness
        run: |
          docker compose up -d
          for port in 8081 8082; do
            for i in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/healthz" && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/healthz" > /dev/null
          done
      - name: Check credential separation between containers
        run: |
          # "!" does not trip errexit in bash, so use explicit checks.
          if docker compose exec -T getmyinvoices-mcp printenv LEXWARE_API_TOKEN > /dev/null; then exit 1; fi
          if docker compose exec -T lexware-office-mcp printenv GMI_API_TOKEN > /dev/null; then exit 1; fi
          docker compose exec -T getmyinvoices-mcp printenv GMI_API_TOKEN > /dev/null
          docker compose exec -T lexware-office-mcp printenv LEXWARE_API_TOKEN > /dev/null
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
